# Merging main into the `release` branch builds Network Monitor and publishes it as a new GitHub Release, then points the
# Homebrew cask in devbymak/homebrew-tap at it. The version comes from scripts/next-version.mjs. A pull request into
# `release` runs the same build without publishing, and shows the version it would release.
name: Release

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

permissions:
  contents: read

# Unlike the default shell, `bash` fails a step when any command in a pipe fails.
defaults:
  run:
    shell: bash

# One at a time, so two merges can't work out the same version.
concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # A squash or rebase would hide main's commits from the version bump, now and in the next
      # release, and a published version can't be replaced. So nothing else gets released.
      - name: Check this is a merge from main
        if: github.event_name == 'push'
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then exit 0; fi
          if git rev-parse --verify --quiet HEAD^2 >/dev/null && git merge-base --is-ancestor HEAD^2 origin/main; then exit 0; fi
          echo "::error::release only takes merges from main (a merge commit, not a squash or rebase, and no direct commits)"
          exit 1
      - run: node --test scripts/*.test.mjs
      - name: Work out the next version
        id: next
        run: |
          output=$(node scripts/next-version.mjs)
          echo "$output" | tee -a "$GITHUB_OUTPUT"
          echo "Next version: ${output#version=}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    if: needs.version.outputs.version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - run: ./test.sh
      - run: NETWORK_MONITOR_VERSION="$VERSION" ./build.sh
      - name: Check the app's signature, version and architecture
        run: |
          app="Network Monitor.app"
          codesign --verify --deep --strict "$app"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = local.networkmonitor
          lipo -archs "$app/Contents/MacOS/networkmonitor" | grep -qw arm64
      # ditto keeps the bundle's signature and extended attributes, which zip would drop.
      - run: ditto -c -k --keepParent "Network Monitor.app" "NetworkMonitor-$VERSION.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: network-monitor
          if-no-files-found: error
          path: NetworkMonitor-*.zip

  publish:
    needs: [version, build]
    if: github.event_name == 'push' && needs.version.outputs.version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: network-monitor
          path: installers
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          # Re-running an old run must not publish old code after a newer merge; the newer run releases it too.
          tip=$(gh api "repos/$GH_REPO/git/ref/heads/release" --jq .object.sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::release has moved on to $tip since this run"
            exit 1
          fi
          # A published version is never replaced.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already released"
            exit 1
          fi
          gh release create "$TAG" installers/* --title "Network Monitor $TAG" --target "$GITHUB_SHA" --generate-notes --latest

  # Its own job, so re-running it can't collide with the release that's already published.
  cask:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: network-monitor
          path: installers
      - name: Update the Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN isn't set, so Homebrew users stay on the previous version"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/devbymak/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sha=$(sha256sum "installers/NetworkMonitor-$VERSION.zip" | cut -d' ' -f1)
          node scripts/render-cask.mjs tap/Casks/network-monitor.rb "$VERSION" "$sha"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/network-monitor.rb
          git diff --cached --quiet && exit 0
          git commit -m "feat(cask): update network-monitor to $VERSION"
          # Other apps' releases push to the same tap, so catch up with them and try again if one got there first.
          for attempt in 1 2 3; do
            git push && exit 0
            sleep $((attempt * 5))
            git pull --rebase
          done
          exit 1
